<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Elite Level Sales CRM</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CC1E1E; --gold:#E8C040; --green:#22AA22; --deep-green:#167016;
  --card:#1A1A1A; --card-mid:#222; --black:#0A0A0A;
  --white:#FFF; --grey:#8A8A8A; --line:rgba(255,255,255,.10);
  --display:'Montserrat',Impact,sans-serif;
  --body:Carlito,Calibri,'Segoe UI',system-ui,sans-serif;
  /* same modular scale as the main app */
  --fs-xs:12px; --fs-sm:14px; --fs-base:16px; --fs-lg:18px; --fs-xl:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--black);color:var(--white);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 30%,rgba(232,192,64,.09),transparent 60%)}
.box{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:36px 32px;width:100%;max-width:400px;
  box-shadow:0 30px 80px rgba(0,0,0,.7)}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}
.brand img{width:74px;height:auto}
.brand b{font-family:var(--display);font-weight:900;font-size:11.5px;line-height:1.25;
  text-transform:uppercase;letter-spacing:.03em}
.brand .e{color:var(--red)}.brand .l{color:var(--gold)}.brand .s{color:var(--green)}

.tabs{display:flex;gap:6px;background:var(--black);padding:4px;border-radius:7px;margin-bottom:22px}
.tabs button{flex:1;padding:9px;border:none;background:none;cursor:pointer;color:var(--grey);
  font-family:var(--body);font-size:13px;font-weight:700;border-radius:5px;transition:.15s}
.tabs button.on{background:var(--card-mid);color:var(--white)}

h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:19px;margin-bottom:5px}
p.sub{color:var(--grey);font-size:13px;margin-bottom:20px;line-height:1.55}
label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--grey);margin-bottom:6px;font-weight:700}
.field{margin-bottom:13px}
input{width:100%;background:var(--black);border:1px solid var(--line);border-radius:5px;
  padding:12px 13px;font-size:16px;color:var(--white);outline:none;transition:border-color .15s}
input:focus{border-color:var(--green)}
button.go{width:100%;margin-top:8px;background:var(--green);color:#fff;border:none;cursor:pointer;
  font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.05em;
  font-size:13.5px;padding:14px;border-radius:5px;box-shadow:0 3px 0 var(--deep-green);
  transition:transform .1s,box-shadow .1s}
button.go:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--deep-green)}
button.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep-green)}
.msg{font-size:var(--fs-sm);margin-top:14px;text-align:center;display:none;line-height:1.5}
.msg.on{display:block}
.msg.err{color:#F08A8A}
.msg.ok{color:var(--green)}
.hint{font-size:var(--fs-xs);color:var(--grey);margin-top:7px}
form{display:none}form.on{display:block}

/* Visible keyboard focus + reduced motion, same rules as the main app. */
:where(a,button,input,[tabindex]):focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* Inline field errors + focusable summary. These live here as well as in
   index.html because this page carries its own stylesheet. */
.err-msg{display:none;color:#F08A8A;font-size:var(--fs-xs);margin-top:4px;line-height:1.5}
.err-msg.on{display:block}
input[aria-invalid="true"]{border-color:var(--red)}
.err-summary{display:none;background:rgba(204,30,30,.10);border:1px solid var(--red);
  border-radius:8px;padding:12px 14px;margin-bottom:16px}
.err-summary.on{display:block}
.err-summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err-summary h2{font-size:var(--fs-sm);color:#F08A8A;margin-bottom:6px;font-family:var(--body)}
.err-summary a{display:block;color:#F08A8A;font-size:var(--fs-xs);
  text-decoration:underline;margin-top:2px}
.err-summary a:hover{color:#fff}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <img src="assets/logo.png" alt="">
      <b><span class="e">Elite</span> <span class="l">Level</span><br><span class="s">Sales</span> CRM</b>
    </div>

    <div class="tabs">
      <button id="tabIn" class="on" onclick="mode('in')">Sign in</button>
      <button id="tabUp" onclick="mode('up')">Request access</button>
    </div>

    <!-- SIGN IN -->
    <form id="fIn" class="on" novalidate>
      <h1>Sign in</h1>
      <p class="sub">This CRM holds client contact details. Access is restricted.</p>

      <div class="err-summary" id="sumIn" role="alert" tabindex="-1" aria-labelledby="sumInT">
        <h2 id="sumInT">There is a problem</h2><div id="sumInL"></div>
      </div>

      <div class="field"><label for="e1">Email</label>
        <input type="email" id="e1" autocomplete="email" aria-describedby="e1err" autofocus>
        <p class="err-msg" id="e1err"></p></div>
      <div class="field"><label for="p1">Password</label>
        <input type="password" id="p1" autocomplete="current-password" aria-describedby="p1err">
        <p class="err-msg" id="p1err"></p></div>
      <button class="go" type="submit">Sign in</button>
    </form>

    <!-- REQUEST ACCESS -->
    <form id="fUp" novalidate>
      <h1>Request access</h1>
      <p class="sub">Your request goes to an admin. You'll be able to sign in once it's approved.</p>

      <div class="err-summary" id="sumUp" role="alert" tabindex="-1" aria-labelledby="sumUpT">
        <h2 id="sumUpT">There is a problem</h2><div id="sumUpL"></div>
      </div>

      <div class="field"><label for="n2">Full name</label>
        <input type="text" id="n2" autocomplete="name" aria-describedby="n2err">
        <p class="err-msg" id="n2err"></p></div>
      <div class="field"><label for="e2">Email</label>
        <input type="email" id="e2" autocomplete="email" aria-describedby="e2err">
        <p class="err-msg" id="e2err"></p></div>
      <div class="field"><label for="p2">Choose a password</label>
        <input type="password" id="p2" autocomplete="new-password" aria-describedby="p2err">
        <p class="hint" id="p2hint">At least 8 characters.</p>
        <p class="err-msg" id="p2err"></p></div>
      <button class="go" type="submit">Request access</button>
    </form>

    <p class="msg" id="msg"></p>
  </div>

<script>
var msg = document.getElementById('msg');

function mode(m) {
  var isIn = m === 'in';
  document.getElementById('fIn').classList.toggle('on', isIn);
  document.getElementById('fUp').classList.toggle('on', !isIn);
  document.getElementById('tabIn').classList.toggle('on', isIn);
  document.getElementById('tabUp').classList.toggle('on', !isIn);
  msg.className = 'msg';
}

function show(text, ok) {
  msg.textContent = text;
  msg.className = 'msg on ' + (ok ? 'ok' : 'err');
}

async function post(url, body) {
  var r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return { ok: r.ok, data: await r.json().catch(function () { return {}; }) };
}

/* Inline errors tied to their field, plus a focusable summary that links to
   each invalid input — per the skill's Forms/Error Placement rules. */
function clearErrors(ids, sumId) {
  ids.forEach(function (id) {
    var f = document.getElementById(id), e = document.getElementById(id + 'err');
    f.removeAttribute('aria-invalid');
    e.textContent = ''; e.classList.remove('on');
  });
  document.getElementById(sumId).classList.remove('on');
}

function fieldError(id, text) {
  var f = document.getElementById(id), e = document.getElementById(id + 'err');
  f.setAttribute('aria-invalid', 'true');
  e.textContent = text; e.classList.add('on');
  return { id: id, text: text };
}

/** Renders the summary and moves focus to it so keyboard and screen-reader
    users land on the problem instead of hunting for it. */
function summarise(sumId, listId, errors) {
  var box = document.getElementById(sumId);
  document.getElementById(listId).innerHTML = errors.map(function (er) {
    return '<a href="#' + er.id + '">' + er.text + '</a>';
  }).join('');
  box.classList.add('on');
  box.focus();
}

document.getElementById('fIn').addEventListener('submit', async function (e) {
  e.preventDefault();
  msg.className = 'msg';
  clearErrors(['e1', 'p1'], 'sumIn');

  var errs = [];
  if (!/^\S+@\S+\.\S+$/.test(document.getElementById('e1').value.trim()))
    errs.push(fieldError('e1', 'Enter a valid email address'));
  if (!document.getElementById('p1').value)
    errs.push(fieldError('p1', 'Enter your password'));
  if (errs.length) return summarise('sumIn', 'sumInL', errs);

  try {
    var r = await post('/api/auth/login', {
      email: document.getElementById('e1').value,
      password: document.getElementById('p1').value
    });
    if (r.ok) { location.href = '/'; return; }
    // Server rejections are about the pair, not one field — summary only.
    summarise('sumIn', 'sumInL', [{ id: 'e1', text: r.data.error || 'Could not sign you in' }]);
  } catch (_) { show('Could not reach the server', false); }
});

document.getElementById('fUp').addEventListener('submit', async function (e) {
  e.preventDefault();
  msg.className = 'msg';
  clearErrors(['n2', 'e2', 'p2'], 'sumUp');

  var errs = [];
  if (document.getElementById('n2').value.trim().length < 2)
    errs.push(fieldError('n2', 'Enter your full name'));
  if (!/^\S+@\S+\.\S+$/.test(document.getElementById('e2').value.trim()))
    errs.push(fieldError('e2', 'Enter a valid email address'));
  if (document.getElementById('p2').value.length < 8)
    errs.push(fieldError('p2', 'Use at least 8 characters'));
  if (errs.length) return summarise('sumUp', 'sumUpL', errs);

  try {
    var r = await post('/api/auth/signup', {
      name: document.getElementById('n2').value,
      email: document.getElementById('e2').value,
      password: document.getElementById('p2').value
    });
    if (!r.ok) {
      return summarise('sumUp', 'sumUpL',
        [{ id: 'e2', text: r.data.error || 'Could not send your request' }]);
    }
    if (r.data.admin) {
      show('Admin account created. Signing you in…', true);
      setTimeout(function () { location.href = '/'; }, 900);
    } else {
      show('Request sent. You can sign in once an admin approves it.', true);
      document.getElementById('fUp').reset();
    }
  } catch (_) { show('Could not reach the server', false); }
});
</script>
</body>
</html>
